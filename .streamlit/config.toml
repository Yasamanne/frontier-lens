[theme]
base = "dark"

# Deep space dark background
backgroundColor      = "#0C0C1A"

# Rich dark purple for sidebar and cards
secondaryBackgroundColor = "#13132A"

# Warm orange — buttons, sliders, active widgets
primaryColor         = "#FF6B2B"

# Off-white with a faint purple tint for readability
textColor            = "#E8E6F0"

font = "sans serif"

[server]
headless = true
enableCORS = false
# Megabytes. Matches upload.MAX_FILE_BYTES, so the uploader itself rejects bigger files
# with a clear message instead of failing the request (e.g. HTTP 413 behind a proxy).
maxUploadSize = 10
