# Open-weight only, hosted on OpenRouter. No closed-source models.
# Policy is the model we generate tasks for. References are comparison models.
# Generator family must differ from policy and reference families.
# OpenRouter has no gemma-4-e4b; 26B-A4B is the small Gemma 4 MoE.
# Append :free to a slug only for the 50 req/day quota (not enough for policy k=8).
- id: gemma4-26b-a4b
  role: policy
  family: gemma
  provider: openai_compatible
  base_url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY
  model: google/gemma-4-26b-a4b-it
  quant: host
  thinking: false
  # Output cap per call. Policy samples that run past ~16k tokens are almost all
  # runaway loops or cut-offs (22 of 24 unparsable samples vs 29 of 407 correct ones
  # used over 8k tokens); the provider default allows 32k+ and one run hit 131k.
  # Leave unset for models that legitimately reason at length.
  max_tokens: 16000
  license: Apache-2.0 / Gemma Terms of Use (check model card)
