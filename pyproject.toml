[project]
name = "frontier-lens"
version = "0.1.0"
description = "Execution-verified eval for open-weight models, with a human-gated item generator."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "openai>=1.0",
  "pydantic>=2.0",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "requests>=2.31",
  "sqlalchemy>=2.0",
  "streamlit>=1.32",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/frontier_lens"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["BLE001", "S110", "UP017", "PLW1510"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
